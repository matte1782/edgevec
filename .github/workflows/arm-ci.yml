# EdgeVec ARM CI: execute the full library suite on native ARM64 hardware.
# GitHub's standard ARM runners avoid cross/QEMU metadata and Docker failures.
name: ARM CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  PROPTEST_CASES: "16"
  NUM_VECTORS: "500"

jobs:
  arm64-test:
    name: ARM64 Build & Test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = aarch64

      - name: Build ARM64 (Release)
        run: cargo build --target aarch64-unknown-linux-gnu --release

      - name: Run ARM64 Tests
        run: cargo test --target aarch64-unknown-linux-gnu --release --lib -- --test-threads=1

      - name: Verify NEON Detection
        run: cargo test --target aarch64-unknown-linux-gnu --release simd -- --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: "1"

  arm64-lint:
    name: ARM64 Clippy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run Clippy for ARM64
        run: cargo clippy --target aarch64-unknown-linux-gnu -- -D clippy::correctness -W clippy::suspicious

  x86-regression:
    name: x86 Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run x86 Tests (Quick Check)
        run: cargo test --lib -- --test-threads=2
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
          PROPTEST_CASES: "16"
